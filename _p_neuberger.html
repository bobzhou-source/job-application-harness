 asset management industry.</p><p><br />Responsibilities:<br /></p><ul><li>Conduct generalist quantitative research using demonstrable market knowledge and intuition across multiple asset classes, including fixed income and equity markets globally, as well as alternative asset classes. Research will be academic and buy-side oriented.</li></ul><ul><li>Solve real world portfolio management problems in a largely autonomous fashion while collaborating with team members.</li></ul><ul><li>Translate academic and/or buy-side research into theses that are implementable and actionable.</li></ul><ul><li>Conduct statistical analysis and develop sophisticated quantitative financial models used for asset allocation and security selection.</li></ul><ul><li>Perform portfolio optimization, performance and attribution analysis, and portfolio risk (coherent measures) analysis.</li></ul><ul><li>Build financial models to perform back tests on asset allocation and security selection strategies.</li></ul><ul><li>Stay connected and current with academic finance research and developments and present findings to team members.</li></ul><ul><li>Prepare materials for presentations.</li></ul><ul><li>Help on daily portfolio management tasks in the areas of cash management, risk reporting and performance attribution.</li></ul><p><br />Qualifications:<br /></p><ul><li>Master’s degree candidates are encouraged in Financial Mathematics or related quantitative field or foreign equivalent.</li></ul><ul><li>Qualified undergraduates in Finance, Mathematics or related STEM field considered.</li></ul><ul><li>Expected graduates in December 2027 or Spring 2028 only.</li></ul><ul><li>Strong statistical, econometrics and applied mathematics grounding.</li></ul><ul><li>Knowledge of fixed income and equity markets.</li></ul><ul><li>Passion for investing.</li></ul><ul><li>Experience developing quantitative models to evaluate the expected return and risk associated with portfolio management decisions is a plus.</l
