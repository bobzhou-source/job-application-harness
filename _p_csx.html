/* testimonials container */
      .testimonials {
        max-width: 100%;
        overflow-x: hidden; /* Hide horizontal overflow */
        position: relative;
        margin-right: auto;
        margin-left: auto;
        cursor: default;
        user-select: none;
        touch-action: none;

      }


      

  .black-background .testimonials:after {
        background: linear-gradient(to right, transparent 0%, black 10%) right;
        content: "";
        height: 500px;
        background-size: 100%;
        position: absolute;
        width: 1%;
        z-index: 21;
        right: 0;
        bottom: 0;
      }


  .black-background .testimonials:before {
          background: linear-gradient(to left, transparent 0%, black 10%) left;
          content: "";
          height: 500px;
          background-size: 100%;
          position: absolute;
          left: 0;
          width: 1%;
          z-index: 20;
          bottom: 0;

      }


      /* Container for the cards */
      .testimonials-carousel {
        flex-wrap: nowrap;
        white-space: nowrap;
        min-height: 100%;
        display: flex;
        margin: 0 auto;
        position: relative;
        cursor: default;
        user-select: none;
        touch-action: none;
        z-index: 1;
      }

      /* Define the keyframes for the animation */
      @keyframes scroll-left {
        0%, 100% {
          transform: translateX(0);
        }
        50% {
          transform: translateX(calc(-365px * 5)); /* Adjust the value based on your card width and number of cards */
        }
      }

      /* Apply the animation */
      .testimonials-carousel {
        animation: scroll-left 75s linear infinite; /* Double the duration to slow it down by half  -- Was 200s*/
      }

        height: 475px;
        width: 375px;

        margin: 10px;
